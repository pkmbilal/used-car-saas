<!doctype html>
<!--
  Shown by the service worker (public/sw.js) when a page can't load offline.
  Plain static HTML with inline styles on purpose: it must render without the
  app's JS/CSS chunks, so its text lives here rather than in lib/dictionaries.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2125" />
    <title>غير متصل | KarSouq</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: 24px 16px;
        background: #1b2125; color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; width: 100%; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 20px 0 8px; font-size: 1.375rem; }
      p { margin: 0; color: rgba(255, 255, 255, 0.7); line-height: 1.6; }
      .en { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
      .en h1 { margin-top: 0; font-size: 1.125rem; }
      button {
        margin-top: 28px; width: 100%; padding: 12px 20px;
        border: 0; border-radius: 999px;
        background: #6fe07c; color: #1b2125;
        font: inherit; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="KarSouq" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>تحقق من اتصالك ثم حاول مرة أخرى.</p>
      <div class="en" lang="en" dir="ltr">
        <h1>You're offline</h1>
        <p>Check your connection and try again.</p>
      </div>
      <button type="button" onclick="location.reload()">حاول مرة أخرى · Try again</button>
    </main>
  </body>
</html>
